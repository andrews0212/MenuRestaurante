spring.application.name=MenuRestaurante-test
spring.datasource.url=jdbc:h2:mem:menubd;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Valores dummy para evitar depender de configuración real de Azure en tests
azure.document.intelligence.endpoint=https://example.cognitiveservices.azure.com/
azure.document.intelligence.key=test-key
azure.document.intelligence.model-id=test-model

